<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradient Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #111; color: white; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .generator { background: #1a1a24; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-bottom: 20px; color: #ccc; }
        .preview { width: 100%; height: 150px; border-radius: 12px; margin-bottom: 20px; transition: 0.3s; border: 1px solid #333; }
        .controls { display: flex; flex-direction: column; gap: 15px; }
        .control-row { display: flex; align-items: center; justify-content: space-between; }
        label { font-size: 14px; color: #aaa; }
        input[type="color"] { width: 40px; height: 35px; border: none; cursor: pointer; background: transparent; }
        input[type="range"] { flex: 1; margin: 0 10px; accent-color: #00d2ff; }
        .code-box { background: #0f0f16; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 13px; color: #00d2ff; word-break: break-all; margin-top: 15px; position: relative; }
        .copy-btn { position: absolute; top: 5px; right: 5px; background: #333; border: none; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .copy-btn:hover { background: #00d2ff; }
    </style>
</head>
<body>
    <div class="generator">
        <h2>🎨 CSS Gradient Generator</h2>
        <div class="preview" id="preview"></div>
        <div class="controls">
            <div class="control-row">
                <label>Rang 1:</label> <input type="color" id="c1" value="#00d2ff">
            </div>
            <div class="control-row">
                <label>Rang 2:</label> <input type="color" id="c2" value="#3a7bd5">
            </div>
            <div class="control-row">
                <label>Burchak: <span id="degVal">90</span>°</label>
                <input type="range" id="angle" min="0" max="360" value="90">
            </div>
        </div>
        <div class="code-box">
            <span id="code"></span>
            <button class="copy-btn" onclick="copyCode()">📋 Nusxa</button>
        </div>
    </div>

    <script>
        const c1 = document.getElementById('c1');
        const c2 = document.getElementById('c2');
        const angle = document.getElementById('angle');
        const degVal = document.getElementById('degVal');
        const preview = document.getElementById('preview');
        const code = document.getElementById('code');

        function updateGradient() {
            const gradient = `linear-gradient(${angle.value}deg, ${c1.value}, ${c2.value})`;
            preview.style.background = gradient;
            code.textContent = `background: ${gradient};`;
            degVal.textContent = angle.value;
        }

        [c1, c2, angle].forEach(el => el.addEventListener('input', updateGradient));
        updateGradient();

        function copyCode() {
            navigator.clipboard.writeText(code.textContent);
            const btn = document.querySelector('.copy-btn');
            btn.textContent = '✅';
            setTimeout(() => btn.textContent = '📋 Nusxa', 1000);
        }
    </script>
</body>
</html>
